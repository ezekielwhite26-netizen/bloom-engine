openapi: 3.1.0
info:
  title: BLOOM / Ama Read-Only Actions
  version: 0.1.0
  description: >-
    Private Ama action surface for BLOOM capability inspection and read-only
    runtime preview. No persistence or canon mutation is exposed.
servers:
  - url: https://ama-runtime-preview.onrender.com
paths:
  /v1/capabilities:
    get:
      operationId: getBloomCapabilities
      summary: Inspect the currently exposed BLOOM capabilities
      x-openai-isConsequential: false
      responses:
        '200':
          description: Current safe capability surface
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityView'
  /v1/runtime/preview:
    post:
      operationId: previewBloomRuntime
      summary: Run a read-only BLOOM runtime preview
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimePreviewBody'
      responses:
        '200':
          description: Read-only runtime preview result
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Invalid or authority-bearing client input rejected
        '503':
          description: Runtime safety boundary rejected the request
components:
  schemas:
    RuntimePreviewBody:
      type: object
      additionalProperties: false
      required:
        - arc
        - command
      properties:
        arc:
          type: string
          minLength: 1
        command:
          type: string
          minLength: 1
        mode:
          type: string
          enum: [DRY_RUN, LIVE_PLAY]
          default: DRY_RUN
        requested_actor_ref:
          anyOf:
            - type: string
            - type: 'null'
          default: null
        requested_target_location_ref:
          anyOf:
            - type: string
            - type: 'null'
          default: null
        requested_object_ref:
          anyOf:
            - type: string
            - type: 'null'
          default: null
        visual_requested:
          type: boolean
          default: false
    CapabilityView:
      type: object
      additionalProperties: false
      required:
        - api_version
        - runtime_preview
        - runtime_commit
        - persistence_live
        - raw_sovereign_query_api
        - client_may_supply_authoritative_evidence
        - model_may_mint_write_authority
      properties:
        api_version:
          type: string
        runtime_preview:
          type: boolean
        runtime_commit:
          type: boolean
        persistence_live:
          type: boolean
        raw_sovereign_query_api:
          type: boolean
        client_may_supply_authoritative_evidence:
          type: boolean
        model_may_mint_write_authority:
          type: boolean
