openapi: 3.1.0
info:
  title: BLOOM / Ama Read-Only Actions
  version: 0.3.1
  description: >-
    Private read-only Action surface for Ama. It exposes BLOOM capability inspection,
    current-state preview, manuscript evidence context, and ADRASTEIA review only.
servers:
  - url: https://ama-runtime.onrender.com
paths:
  /v1/capabilities:
    get:
      operationId: getAmaRuntimeCapabilities
      summary: Check hosted Ama runtime capabilities
      description: Read the capability flags exposed by the hosted Ama runtime.
      x-openai-isConsequential: false
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Runtime capability flags
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing or invalid bearer credentials

  /v1/runtime/preview:
    post:
      operationId: inspectAsterHollowCurrentState
      summary: Inspect the active Aster Hollow scene
      description: >-
        Read the verified active scene in DRY_RUN mode without changing state.
      x-openai-isConsequential: false
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [arc, command]
              properties:
                arc:
                  type: string
                  enum: [Aster Hollow / At the Threshold]
                  default: Aster Hollow / At the Threshold
                command:
                  type: string
                  minLength: 1
                mode:
                  type: string
                  enum: [DRY_RUN]
                  default: DRY_RUN
                requested_actor_ref:
                  type: [string, 'null']
                requested_target_location_ref:
                  type: [string, 'null']
                requested_object_ref:
                  type: [string, 'null']
                visual_requested:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Verified read-only BLOOM runtime result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing or invalid bearer credentials
        '422':
          description: Request is outside the preview scope
        '503':
          description: Live BLOOM state was unavailable

  /v1/manuscript/context:
    post:
      operationId: prepareAmaManuscriptContext
      summary: Prepare manuscript evidence context
      description: >-
        Read bounded BLOOM evidence for an Aster Hollow manuscript scene and issue a
        temporary context id. HISTORICAL_MANUSCRIPT omits later mutable state.
      x-openai-isConsequential: false
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - arc
                - command
                - scene_or_chapter
                - character_names
                - location_names
              properties:
                arc:
                  type: string
                  enum: [Aster Hollow / At the Threshold]
                  default: Aster Hollow / At the Threshold
                command:
                  type: string
                  minLength: 1
                scene_or_chapter:
                  type: string
                  minLength: 1
                temporal_scope:
                  type: string
                  enum: [HISTORICAL_MANUSCRIPT, CURRENT_SCENE]
                  default: HISTORICAL_MANUSCRIPT
                character_names:
                  type: array
                  items:
                    type: string
                  description: Exact canonical character names needed for the scene.
                location_names:
                  type: array
                  items:
                    type: string
                  description: Exact canonical location names needed for the scene.
      responses:
        '200':
          description: Issued manuscript context and evidence keys
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing or invalid bearer credentials
        '422':
          description: Invalid request or unresolved exact identity
        '503':
          description: Live BLOOM authoring evidence was unavailable

  /v1/manuscript/review:
    post:
      operationId: reviewAmaManuscriptDraft
      summary: Review a manuscript draft with ADRASTEIA
      description: >-
        Check declared draft claims against an issued manuscript context and return
        diagnostic findings for CALLIOPE/Ama to use during revision.
      x-openai-isConsequential: false
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [context_id, phase, claims]
              properties:
                context_id:
                  type: string
                  minLength: 1
                phase:
                  type: string
                  enum: [DRAFT, FINAL]
                claims:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [kind, key]
                    properties:
                      kind:
                        type: string
                        enum: [FACT, PLAYER_COMMITMENT]
                      key:
                        type: string
                        description: Evidence key issued by prepareAmaManuscriptContext.
                reader_new_subjects:
                  type: array
                  items:
                    type: string
                  default: []
                oriented_subjects:
                  type: array
                  items:
                    type: string
                  default: []
      responses:
        '200':
          description: ADRASTEIA review findings and pass/block status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing or invalid bearer credentials
        '410':
          description: Manuscript context expired or was not issued by the service
        '422':
          description: Invalid review phase or body
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
